  - metricId: precedent.recipients
    label: Guaranteed-income recipients, cumulative
    value: 30000
    unit: people
    asOf: 2026-10-14
    sourceName: Guaranteed Income Pilots Dashboard
    sourceUrl: https://guaranteedincome.us/
