# Challenger, Gray & Christmas monthly job-cut reports: cuts where the
# employer cited artificial intelligence. Challenger publishes no API, so a
# maintainer updates this file when each report lands (first week of the month).
# The runner marks this source failed if the newest record is older than maxAgeDays.
reviewedOn: 2026-10-14
maxAgeDays: 75
metrics:
  - metricId: labor.ai_layoffs_ttm
    label: AI-attributed job cuts, trailing 12 mo
    value: 157597
    unit: jobs
    asOf: 2026-09-30
    sourceName: Challenger, Gray & Christmas, Sept 2026 report
    sourceUrl: https://www.challengergray.com/blog/job-cuts-fall-in-september-hiring-plans-up-3-over-2025-on-weak-early-seasonal-hiring/
    verified: true
    # Derived: 2026 YTD through Sept (120,136) + 2025 full year (54,836)
    #          − 2025 Jan–Sep (48,414 YTD Oct − 31,039 Oct = 17,375).
    # 2025 full year: https://www.challengergray.com/blog/2025-year-end-challenger-report-highest-q4-layoffs-since-2008-lowest-ytd-hiring-since-2010/
    # 2025 Oct:       https://www.challengergray.com/blog/october-challenger-report-153074-job-cuts-on-cost-cutting-ai/
    note: "Derived: 120,136 cut YTD 2026 (21% of all cuts) plus Oct–Dec 2025"
  - metricId: labor.ai_layoffs_ytd
    label: AI-attributed job cuts, 2026 to date
    value: 120136
    unit: jobs
    asOf: 2026-09-30
    sourceName: Challenger, Gray & Christmas, Sept 2026 report
    sourceUrl: https://www.challengergray.com/blog/job-cuts-fall-in-september-hiring-plans-up-3-over-2025-on-weak-early-seasonal-hiring/
    verified: true
    note: "Jan–Sep 2026, employer cited AI. 21% of all announced cuts. Unscored: the trailing-12-month figure is the scored one"

# Monthly AI-attributed cuts, from each Challenger report. Drives the gap chart on
# the tracker (web/src/lib/gap.ts). ytd is the report's year-to-date figure; aiCuts
# is the month, where the report states it. Jan-May 2025 are not yet recorded; the
# June 2025 report puts Jan-Jun 2025 at 75 combined. 2025-07 is ytd(Jul) - ytd(Jun).
monthly:
  - { month: '2025-06', aiCuts: null, ytd: 75, url: https://www.challengergray.com/blog/june-2025-companies-announce-virtually-the-same-number-of-cuts-as-last-year-highest-q2-ytd-cuts-since-2020/ }
