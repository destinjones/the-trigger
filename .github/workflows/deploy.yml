name: deploy

# Static build of web/. Deploys to GitHub Pages by default (no secrets needed).
# If CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are set, also deploys to
# Cloudflare Pages project "the-trigger".
on:
  push:
    branches: [main]
    paths: ['web/**', 'index/**', 'data/**', 'predictions/**', 'package.json', 'pnpm-lock.yaml']
  # Commits made by the snapshot job's GITHUB_TOKEN do not trigger `push`.
  workflow_run:
    workflows: [snapshot]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Build
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: pnpm build
      - name: Every page shows the newest snapshot
        run: pnpm check-site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist
      - name: Cloudflare Pages
        if: env.CF_TOKEN != ''
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          BASE_PATH=/ pnpm build
          npx --yes wrangler@4 pages deploy web/dist --project-name the-trigger --branch main

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
