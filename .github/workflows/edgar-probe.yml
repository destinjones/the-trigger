name: edgar-probe
# Temporary diagnostic: does data.sec.gov reject our User-Agent, or the runner?
on:
  push:
    branches: [main]
    paths: ['.github/workflows/edgar-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: curl with several agents
        run: |
          U=https://data.sec.gov/submissions/CIK0000789019.json
          for ua in "TheTrigger destinjones@users.noreply.github.com" "TheTrigger 46937471-destinjones@users.noreply.github.com" "The Trigger 46937471+destinjones@users.noreply.github.com" "TheTrigger admin@example.org" "TheTrigger a+b@example.org" "TheTrigger"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "User-Agent: $ua" -H "Accept-Encoding: gzip, deflate" "$U")
            echo "PROBE curl $code  [$ua]"
          done
          curl -s -o /dev/null -w "PROBE curl-no-ua %{http_code}\n" -A "" "$U"
          echo "PROBE runner ip $(curl -s https://api.ipify.org)"
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: node fetch
        run: |
          node -e '
          const u="https://data.sec.gov/submissions/CIK0000789019.json";
          for (const ua of ["TheTrigger 46937471+destinjones@users.noreply.github.com","Sample Company Name AdminContact@samplecompany.com"]) {
            const r = await fetch(u,{headers:{"user-agent":ua,"accept":"application/json"}});
            console.log("PROBE fetch", r.status, ua);
          }' --input-type=module
