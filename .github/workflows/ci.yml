name: ci
on:
  pull_request:
  push:
    branches: [main]
    # data/ is checked by data.yml on push. The snapshot job's own commits use
    # GITHUB_TOKEN and trigger neither; it runs the same checks before committing.
    paths-ignore: ['data/**']
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # HEAD^1 is the base for the revision check.
          fetch-depth: 2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm validate-data -- --against HEAD^1
      - run: pnpm audit-chain
      - run: pnpm build
      - run: pnpm check-site
