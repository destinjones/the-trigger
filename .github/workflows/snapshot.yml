name: snapshot

# Pull every source once a day and commit data/YYYY-MM-DD.json.
# Git history is the time series: this job only ever adds files or new revisions.
on:
  schedule:
    # 14:15 UTC = 10:15 ET, after BLS 8:30 ET releases and Federal Register publication.
    - cron: '15 14 * * *'
  # Rescore today when the model, a source, or a curated file changes, so the
  # site never shows numbers computed by code that is no longer on main.
  # Pushes made by this job use GITHUB_TOKEN and do not retrigger it.
  push:
    branches: [main]
    paths:
      - 'index/**'
      - 'sources/**'
      - 'scripts/snapshot.ts'
      - 'scripts/lib/**'
  workflow_dispatch:
    inputs:
      date:
        description: 'Snapshot date (YYYY-MM-DD). Blank = today (UTC).'
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

      - name: Pull sources
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          DATE="${{ github.event.inputs.date }}"
          pnpm snapshot ${DATE:+--date "$DATE"}

      - name: Resolve predictions and regenerate SCOREBOARD.md
        run: pnpm scorecard

      - name: Commit
        run: |
          git config user.name "the-trigger-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ predictions/ SCOREBOARD.md
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          D=$(ls data/ | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$' | sort | tail -1 | cut -d. -f1)
          R=$(node -p "require('./data/$D.json').readiness")
          git commit -m "snapshot $D: readiness $R"
          git push

      # One open issue labelled pipeline-health carries whatever needs a person:
      # failed sources, skipped sources, curated files about to expire, a stalled
      # job. Its body is replaced on every run; it closes when a run is clean.
      - name: Report pipeline health
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pnpm --silent health --out health.md | tee -a "$GITHUB_STEP_SUMMARY"
          N=$(gh issue list --label pipeline-health --state open --json number -q '.[0].number')
          if [ -s health.md ]; then
            if [ -n "$N" ]; then
              gh issue edit "$N" --body-file health.md
            else
              gh label create pipeline-health --color B60205 --description "Opened and closed by the snapshot job" 2>/dev/null || true
              gh issue create --title "Pipeline health: action needed" --label pipeline-health --body-file health.md
            fi
          elif [ -n "$N" ]; then
            gh issue close "$N" --comment "The snapshot run came back clean."
          fi
