name: Data correction
description: A number on the site is wrong, stale, or better sourced elsewhere.
labels: [data]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: Page and the metric or record, as labelled on the site.
      placeholder: Tracker, "Unemployment rate"
    validations:
      required: true
  - type: input
    id: shown
    attributes:
      label: What the site shows
      placeholder: 4.2% as of 2026-09-01
    validations:
      required: true
  - type: input
    id: correct
    attributes:
      label: What it should be
    validations:
      required: true
  - type: input
    id: evidence
    attributes:
      label: Link to the upstream record
      description: A deep link to the record, not a homepage or a news story about it, where possible.
      placeholder: https://
    validations:
      required: true
